[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sesac-thumbnail-creation"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.40,<2",
    "opencv-python-headless>=4.10,<5",
    "Pillow>=10.4,<13",
    "numpy>=1.26,<3",
    "psutil>=6,<8",
]

[tool.setuptools]
packages = ["services"]
py-modules = ["workflow", "app"]
